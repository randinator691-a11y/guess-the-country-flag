<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess the Country 🌎</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #172238;
        }

        h1 {
            margin: 0;
        }

        .game {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
        }

        .question {
            font-size: 28px;
            margin-bottom: 30px;
        }

        button {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 16px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            color: #101827;
        }

        button:hover {
            background: #dce8ff;
        }

        #score {
            font-size: 20px;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🌎 Guess the Country</h1>
    </header>

    <main class="game">

        <div id="score">
            Score: 0
        </div>

        <div class="question" id="question">
            Which country has the Eiffel Tower?
        </div>

        <button onclick="checkAnswer('France')">
            🇫🇷 France
        </button>

        <button onclick="checkAnswer('Italy')">
            🇮🇹 Italy
        </button>

        <button onclick="checkAnswer('Spain')">
            🇪🇸 Spain
        </button>

        <button onclick="checkAnswer('Germany')">
            🇩🇪 Germany
        </button>

        <p id="result"></p>

    </main>

    <script>

        let score = 0;

        function checkAnswer(answer) {

            const result = document.getElementById("result");

            if (answer === "France") {

                score++;

                result.textContent = "✅ Correct!";

            } else {

                result.textContent = "❌ Incorrect!";

            }

            document.getElementById("score").textContent =
                "Score: " + score;
        }

    </script>

</body>

</html>
